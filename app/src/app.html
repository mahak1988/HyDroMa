<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="A">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />

  <meta
    name="description"
    content="داشبورد هوشمند اکوسیستم اکو نوژین؛ از علم و فناوری تا مدیریت سرزمین و معیشت پایدار."
  />

  <meta name="theme-color" content="#fbf8f2" />

  <title>داشبورد | اکو نوژین</title>

  <link
    rel="icon"
    href="./assets/logos/eco-nojin-logo.svg"
    type="image/svg+xml"
  />

  <link rel="stylesheet" href="./assets/fonts/fonts.css" />
  <link rel="stylesheet" href="./styles/reset.css" />
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/themes.css" />
  <link rel="stylesheet" href="./styles/typography.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <link rel="stylesheet" href="./styles/responsive.css" />
  <link rel="stylesheet" href="./styles/application-shell.css" />

  <style>
    /* -------------------------------------------------------
       ECO NOJIN — APP SHELL ENHANCEMENTS
       Temporary structural styling.
       Final visual system will be consolidated in app.css.
    ------------------------------------------------------- */

    :root {
      --en-ivory: #fbf8f2;
      --en-paper: #fffdf9;
      --en-ink: #343d35;
      --en-muted: #85877c;
      --en-olive: #687653;
      --en-olive-dark: #45543d;
      --en-terracotta: #c8754c;
      --en-gold: #c9a45c;
      --en-line: rgba(91, 91, 69, 0.12);
      --en-shadow: 0 12px 40px rgba(72, 62, 44, 0.055);
    }

    html {
      scroll-behavior: smooth;
    }

    body.app-body {
      background: var(--en-ivory);
      color: var(--en-ink);
      min-height: 100vh;
    }

    .shell {
      min-height: 100vh;
    }

    /* Accessible skip navigation */

    .skip-link {
      position: fixed;
      top: 12px;
      inset-inline-start: 12px;
      z-index: 9999;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--en-olive-dark);
      color: white;
      transform: translateY(-160%);
      transition: transform 180ms ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    /* Brand */

    .sidebar-brand {
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: linear-gradient(145deg, #d88b5b, #b96845);
      color: white;
      box-shadow: 0 6px 18px rgba(185, 104, 69, 0.18);
    }

    .brand-mark svg {
      width: 25px;
      height: 25px;
    }

    .sidebar-name {
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .sidebar-sub {
      letter-spacing: 0.12em;
      font-size: 10px;
      opacity: 0.65;
    }

    /* Sidebar */

    .sidebar {
      background: var(--en-paper);
      border-inline-end: 1px solid var(--en-line);
    }

    .sidebar-head {
      padding-block: 24px;
      border-bottom: 1px solid var(--en-line);
    }

    .sidebar-foot {
      border-top: 1px solid var(--en-line);
    }

    /* Main workspace */

    .shell-body {
      min-width: 0;
    }

    .topbar {
      min-height: 76px;
      background: rgba(255, 253, 249, 0.88);
      border-bottom: 1px solid var(--en-line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .content {
      width: 100%;
      max-width: 1720px;
      margin-inline: auto;
      padding: clamp(22px, 3vw, 42px);
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 30px;
    }

    .page-title {
      font-size: clamp(1.45rem, 2.5vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      color: var(--en-ink);
      margin: 0;
    }

    .page-sub {
      color: var(--en-muted);
      font-size: 0.92rem;
      line-height: 1.9;
      margin-top: 9px;
      max-width: 620px;
    }

    /* Controls */

    .icon-btn,
    .profile-btn,
    .seg-btn {
      transition:
        background 180ms ease,
        border-color 180ms ease,
        color 180ms ease,
        transform 180ms ease;
    }

    .icon-btn:hover,
    .profile-btn:hover {
      transform: translateY(-1px);
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(200, 117, 76, 0.45);
      outline-offset: 3px;
    }

    /* Decorative workspace accent */

    .workspace-accent {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .workspace-accent::before {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      inset-inline-end: -150px;
      top: -180px;
      border: 1px solid rgba(200, 117, 76, 0.1);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }

    /* Demo indicator */

    .demo-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(201, 164, 92, 0.12);
      color: #8b6a30;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .demo-indicator::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--en-gold);
      box-shadow: 0 0 0 3px rgba(201, 164, 92, 0.13);
    }

    /* Responsive refinements */

    @media (max-width: 760px) {
      .content {
        padding: 22px 16px;
      }

      .page-head {
        flex-direction: column;
        gap: 14px;
      }

      .topbar {
        min-height: 66px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body class="app-body">

  <a class="skip-link" href="#content">
    رفتن به محتوای اصلی
  </a>

  <div class="shell">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar" id="sidebar">

      <div class="sidebar-head">

        <a
          class="sidebar-brand"
          href="#/dashboard"
          aria-label="صفحه اصلی اکو نوژین"
        >

          <span class="brand-mark" aria-hidden="true">

            <!-- Abstract typographic-inspired brand symbol -->
            <svg
              viewBox="0 0 32 32"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M8 23.5C8 15.5 13 8.5 24 7"
                stroke="white"
                stroke-width="2.5"
                stroke-linecap="round"
              />

              <path
                d="M8 23.5C13 25 20 23 24 16"
                stroke="white"
                stroke-width="2.5"
                stroke-linecap="round"
              />

              <circle
                cx="8"
                cy="23.5"
                r="2"
                fill="white"
              />

              <circle
                cx="24"
                cy="7"
                r="2"
                fill="white"
              />

            </svg>

          </span>

          <span class="sidebar-brand-text">

            <span
              class="sidebar-name"
              data-app-i18n="brand.name"
            >
              اکو نوژین
            </span>

            <span class="sidebar-sub">
              ECO NOJIN
            </span>

          </span>

        </a>

      </div>

      <nav
        class="side-nav"
        id="side-nav"
        aria-label="ناوبری اصلی"
      ></nav>

      <div class="sidebar-foot">

        <span
          class="badge badge-aqua"
          data-app-i18n="common.demo"
        >
          نمایشی
        </span>

        <span class="sidebar-ver">
          Version 0.1
        </span>

      </div>

    </aside>

    <!-- Mobile overlay -->

    <div
      class="scrim"
      id="scrim"
      aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN APPLICATION
    ====================================================== -->

    <div class="shell-body">

      <!-- TOPBAR -->

      <header class="topbar">

        <button
          class="icon-btn topbar-menu"
          id="menu-btn"
          type="button"
          aria-expanded="false"
          aria-controls="sidebar"
          aria-label="باز و بسته کردن ناوبری"
          data-app-i18n-aria="a11y.menu"
        >

          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>

        </button>


        <!-- Breadcrumb -->

        <nav
          class="crumbs"
          id="crumbs"
          aria-label="مسیر صفحه"
        ></nav>


        <!-- Header actions -->

        <div class="topbar-actions">

          <!-- Theme -->

          <div
            class="switch-group switch-group--light"
            role="group"
            aria-label="انتخاب پوسته"
            data-app-i18n-aria="a11y.theme"
          >

            <button
              class="seg-btn"
              type="button"
              data-theme-set="A"
              aria-pressed="true"
            >
              A
            </button>

            <button
              class="seg-btn"
              type="button"
              data-theme-set="B"
              aria-pressed="false"
            >
              B
            </button>

          </div>


          <!-- Language -->

          <div
            class="switch-group switch-group--light"
            role="group"
            aria-label="انتخاب زبان"
            data-app-i18n-aria="a11y.lang"
          >

            <button
              class="seg-btn"
              type="button"
              data-lang-set="fa"
              aria-pressed="true"
            >
              فا
            </button>

            <button
              class="seg-btn"
              type="button"
              data-lang-set="en"
              aria-pressed="false"
            >
              EN
            </button>

          </div>


          <!-- Notifications -->

          <div class="dropdown">

            <button
              class="icon-btn notif-btn"
              id="notif-btn"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="notif-panel"
              aria-label="اعلان‌ها"
              data-app-i18n-aria="a11y.notifications"
            >

              <svg
                viewBox="0 0 24 24"
                width="21"
                height="21"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z" />
                <path d="M10 20a2 2 0 0 0 4 0" />
              </svg>

              <span
                class="notif-dot"
                id="notif-dot"
                aria-hidden="true"
              ></span>

            </button>

            <div
              class="dropdown-panel dd-panel--notif"
              id="notif-panel"
              hidden
            ></div>

          </div>


          <!-- User profile -->

          <div class="dropdown">

            <button
              class="profile-btn"
              id="profile-btn"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="profile-panel"
              aria-label="پروفایل کاربر"
              data-app-i18n-aria="a11y.profile"
            >

              <span
                class="avatar"
                aria-hidden="true"
              >

                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="8" r="3.6" />
                  <path d="M5 20c0-3.6 3.4-5.4 7-5.4s7 1.8 7 5.4" />
                </svg>

              </span>


              <span class="profile-meta">

                <span
                  class="profile-name"
                  data-app-i18n="topbar.demoUser"
                >
                  کاربر نمایشی
                </span>

                <span
                  class="profile-role"
                  data-app-i18n="topbar.demoRole"
                >
                  مدیر اکوسیستم (نمایشی)
                </span>

              </span>


              <span
                class="profile-chev"
                aria-hidden="true"
              >

                <svg
                  viewBox="0 0 24 24"
                  width="16"
                  height="16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M6 9l6 6 6-6" />
                </svg>

              </span>

            </button>


            <div
              class="dropdown-panel dd-panel--profile"
              id="profile-panel"
              hidden
            ></div>

          </div>

        </div>

      </header>


      <!-- ===================================================
           CONTENT WORKSPACE
      ==================================================== -->

      <main
        class="content workspace-accent"
        id="content"
        tabindex="-1"
      >

        <!-- Page heading -->

        <section
          class="page-head"
          aria-labelledby="page-title"
        >

          <div class="page-head-text">

            <h1
              class="page-title"
              id="page-title"
            >
              داشبورد
            </h1>

            <p
              class="page-sub"
              id="page-sub"
            ></p>

          </div>


          <div
            class="page-actions"
            id="page-actions"
          ></div>

        </section>


        <!-- Dynamic application view -->

        <section
          class="view"
          id="view"
          aria-live="polite"
          aria-busy="false"
        ></section>

      </main>


      <!-- FOOTER -->

      <footer class="app-footer">

        <span>
          © ۲۰۲۶ کشت و صنعت دشت امید نارون. تمامی حقوق محفوظ است.
        </span>

        <span>
          معاونت فناوری و تحول دیجیتال اکو نوژین
        </span>

      </footer>

    </div>

  </div>


  <!-- APPLICATION ENTRY -->

  <script
    type="module"
    src="./js/app.js"
  ></script>

</body>
</html>
