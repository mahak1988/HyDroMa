  <rect width="680" height="150" fill="#F3F8F7"/>
  <text x="24" y="94" font-family="Manrope, Arial, sans-serif" font-size="80" font-weight="800" letter-spacing="-4" fill="#173B63">Hy</text>
  <text x="118" y="94" font-family="Manrope, Arial, sans-serif" font-size="80" font-weight="400" letter-spacing="-3" fill="#75C8C0">Dro</text>
  <text x="288" y="94" font-family="Manrope, Arial, sans-serif" font-size="80" font-weight="800" letter-spacing="-4" fill="#173B63">MA</text>
  <line x1="27" y1="113" x2="420" y2="113" stroke="#C9A34A" stroke-width="1.2"/>
  <text x="28" y="138" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" letter-spacing="3.5" fill="#5A7A78">SCIENTIFIC ENGINE · HyDroMA</text>
