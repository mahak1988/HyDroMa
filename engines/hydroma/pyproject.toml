[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroma"
version = "0.1.0"
description = "Eco Nojin HyDroMA scientific runtime - Phase 2.1 MVP (Water Balance vertical slice)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]", "httpx"]
test = ["pytest", "httpx"]
# Optional environmental-data connectors (Phase 3.96). The scientific core
# never imports these; they are only needed to run live acquisition.
connect = ["httpx", "pystac"]
raster = ["rasterio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hydroma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"