[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workforce"
version = "0.1.0"
description = "Eco Nojin AI workforce governance layer - agent registry, permissions, hash-chained audit, policy limits and the model-gateway contract (execution plane NOT_ACTIVE, ADR-0013)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_workforce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
