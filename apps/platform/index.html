<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#5a3d50" />
    <title>Eco Nojin — platform</title>
    <meta name="description" content="Eco Nojin platform workspace: landscapes, agriculture, MRV, projects, knowledge, finance, community and governance." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("eco.theme") || "system";
          var resolved = mode === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : mode;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
