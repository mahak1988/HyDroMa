<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f6b4f" />
    <title>Eco Nojin — از علم تا معیشت</title>
    <meta name="description" content="Eco Nojin — اکوسیستم دیجیتال برای مدیریت، توسعه و احیای سرزمین‌های زنده." />
    <link rel="canonical" href="https://eco-nojin.example/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Theme bootstrap: apply before first paint (shared contract with the console).
      (function () {
        try {
          var mode = localStorage.getItem("eco.theme") || "system";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
        } catch (error) {
          /* storage unavailable: default theme from tokens */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
