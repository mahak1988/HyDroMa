  <text x="188" y="92" font-family="Fraunces, Georgia, serif" font-size="78" font-weight="500" letter-spacing="-2.5" fill="#D9682B">Nojin</text>
  <line x1="27" y1="113" x2="410" y2="113" stroke="#C9A34A" stroke-width="1.4"/>
  <circle cx="410" cy="113" r="3.2" fill="#C9A34A"/>
  <text x="28" y="138" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="4.2" fill="#8A765E">LIVING TERRITORIES</text>
