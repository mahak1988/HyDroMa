name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Install
        run: pnpm install --frozen-lockfile --no-audit --no-fund

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Architecture boundaries
        run: pnpm run check:boundaries

      - name: Design tokens
        run: pnpm run check:tokens

      - name: Unit tests
        run: pnpm exec vitest run

      - name: API service tests (real persistence, auth, RBAC)
        run: pnpm run test:api

      - name: Build every app for the unified host
        run: pnpm run build:all

  hydroma-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HyDroMA (test + api extras)
        run: pip install -e "engines/hydroma[api,test]"

      - name: Run HyDroMA Python regression suite
        run: pytest engines/hydroma/tests
